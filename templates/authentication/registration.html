{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Registration - Cropilot</title>
  <meta name="description" content="">
  <meta name="keywords" content="">

  <!-- Favicons -->
  <link href="{% static 'assets/img/favicon.png' %}" rel="icon">
  <link href="{% static 'assets/img/favicon.png' %}" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">

</head>

<body class="appointment-page">

  <header id="header" class="header fixed-top">

    <div class="branding d-flex align-items-center">

      <div class="container position-relative d-flex align-items-center justify-content-between">
        <a href="{% url 'INDEX' %}" class="logo d-flex align-items-center">
          <img src="{% static 'assets/img/favicon.png' %}" alt="">
          <h1 class="sitename">Cropilot</h1>
        </a>

        <nav id="navmenu" class="navmenu">
          <ul>
            <li><a href="{% url 'LOGIN' %}">Login</a></li>
          </ul>
        </nav>

      </div>

    </div>

  </header>

  <main class="main">

    <!-- Registration Section -->
    <section id="appointmnet" class="appointmnet section">

      <div class="container" data-aos="fade-up" data-aos-delay="100">

        <div class="row">
          <div class="col-lg-8 mx-auto">
            <div class="booking-wrapper">
              <div class="booking-header text-center" data-aos="fade-up" data-aos-delay="200">
                <h2>Create an Account</h2>
              </div>

              {% if error %}
              <div class="alert alert-danger text-center" role="alert" data-aos="fade-up" data-aos-delay="300">
                {{ error }}
              </div>
              {% endif %}

              <div class="appointment-form" data-aos="fade-up" data-aos-delay="400">
                <form action="api-register/" method="POST">
                  {% csrf_token %}
                  <div class="row gy-4">
                    <div class="col-md-6">
                      <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="col-md-6">
                      <input type="email" id="email" name="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="col-md-6">
                      <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="col-md-6">
                      <select id="role" name="role" class="form-select" required>
                        <option value="" disabled selected>-- Select your role --</option>
                        <option value="farmer">Farmer</option>
                        <option value="officer">Officer</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <button type="submit" class="btn-book">Register</button>
                    </div>
                  </div>
                </form>
              </div>

            </div>
          </div>
        </div>

      </div>

    </section><!-- /Registration Section -->

  </main>

  <!-- Footer -->
  <footer id="footer" class="footer-16 footer position-relative">
    <div class="container">
      <div class="footer-main" data-aos="fade-up" data-aos-delay="100">
        <div class="row align-items-start">

          <div class="col-lg-5">
            <div class="brand-section">
              <a href="{% url 'INDEX' %}" class="logo d-flex align-items-center mb-4">
                <span class="sitename">Cropilot</span>
              </a>
              <p class="brand-description">This is my BCA final-year project.</p>
              <div class="contact-info mt-5">
                <div class="contact-item">
                  <i class="bi bi-github"></i>
                  <span><a href="https://github.com/jibintgeorgecareer-DEV">GITHUB</a></span>
                </div>
                <div class="contact-item">
                  <i class="bi bi-linkedin"></i>
                  <span><a href="https://linkedin.com/in/jibintgeorge">LinkedIn</a></span>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </footer>

  <!-- Scroll Top -->
  <a href="#!" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i
      class="bi bi-arrow-up-short"></i></a>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>
  <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
  <script src="{% static 'assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
  <script src="{% static 'assets/vendor/purecounter/purecounter_vanilla.js' %}"></script>
  <script src="{% static 'assets/vendor/swiper/swiper-bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>

</body>

</html>
